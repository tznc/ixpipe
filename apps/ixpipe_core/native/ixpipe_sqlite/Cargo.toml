[package]
name = "ixpipe_sqlite"
version = "0.1.0"
edition = "2021"

[lib]
name = "ixpipe_sqlite"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
# SQLite compiled from source, so every target (Android included) builds the
# same library with no system SQLite.
rusqlite = { version = "0.37", features = ["bundled"] }
