[package]
name = "ixpipe_python"
version = "0.1.0"
edition = "2024"

[lib]
name = "ixpipe_python"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
libc = "0.2"
# RustPython, embedded and sandboxed: without the `host_env` feature the VM
# has no filesystem, os, socket, subprocess or ctypes modules at all, and
# without `stdio` its print goes where we point sys.stdout. The pure-Python
# modules the allowed ones need are frozen into the library (build.rs), so
# nothing is read from disk at run time, Android included.
rustpython-vm = { version = "0.6.0", default-features = false, features = ["compiler", "gc"] }
rustpython-stdlib = { version = "0.6.0", default-features = false, features = ["compiler"] }

[build-dependencies]
# Only its LIB_PATH: where build.rs finds the modules to freeze.
rustpython-pylib = "0.6.0"

# Size over speed: the interpreter ships in every app, phones included
# (31 MB with the whole stdlib at -O3, 18.6 MB like this).
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
strip = true
