[package]
name = "ixpipe_duckdb"
version = "0.1.0"
edition = "2021"

[lib]
name = "ixpipe_duckdb"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"
# DuckDB v2.0.0 compiled from source, so every target builds the same engine.
# duckdb-rs encodes the DuckDB version as 1.MAJOR_MINOR_PATCH; ~ keeps it on v2.0.0.
duckdb = { version = "~1.20000.1", features = ["bundled", "parquet", "json"] }
